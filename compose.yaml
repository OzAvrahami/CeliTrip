name: celitrip-local
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: celitrip
      POSTGRES_PASSWORD: celitrip_local_only
      POSTGRES_DB: celitrip_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celitrip -d celitrip_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
